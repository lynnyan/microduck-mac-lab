[project]
name = "microduck-mac-lab"
version = "0.1.0"
description = "Native MuJoCo and CPU PPO experiments for MicroDuck on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco==3.10.0",
  "numpy>=2,<3",
  "stable-baselines3==2.9.2",
  "gymnasium>=1.2,<2",
  "torch==2.9.1",
  "tensorboard>=2.20,<3",
  "onnxruntime>=1.24.4,<2",
  "onnx>=1.20.1,<2",
  "better-actuator-models",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
]

[tool.uv]
package = false

[dependency-groups]
tutorial = ["matplotlib>=3.10,<4", "markdown>=3.10,<4"]

[tool.uv.sources]
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }
